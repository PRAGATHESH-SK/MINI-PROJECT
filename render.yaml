services:
  - type: web
    name: connecting-tech
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm --prefix server install && npm --prefix client install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: connecting-tech-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: DEMO_MODE
        value: "true"
      - key: MAX_GEOFENCE_RADIUS_METERS
        value: "1000"
      - key: MAX_GPS_ACCURACY_METERS
        value: "100"

databases:
  - name: connecting-tech-db
    plan: free
    region: singapore
    databaseName: connecting_tech
    user: postgres

